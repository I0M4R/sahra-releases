# Channel schedules for the Sahra app, rebuilt every 2 hours.
# Published as the single asset of the "schedule" prerelease and replaced in place,
# so the repo history never grows. Prerelease: the app's updater reads releases/latest,
# which skips prereleases, so app releases are untouched.
name: schedule

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build schedule.json.gz from epgshare01.online
        run: python schedule/build_schedule.py schedule.json.gz
      - name: Publish (replace the one asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view schedule >/dev/null 2>&1 || gh release create schedule \
            --prerelease --latest=false --title "جدول القنوات" \
            --notes "Built automatically every 2 hours from epgshare01.online. Not an app release."
          gh release upload schedule schedule.json.gz --clobber
